name: Backend CD

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: jigmnnaga-backend
  EC2_INSTANCE_ID: i-0e9ccacce90b1822e

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('aud:', payload.aud);
            console.log('sub:', payload.sub);
            console.log('repository:', payload.repository);
            console.log('repository_id:', payload.repository_id);
            console.log('repository_owner:', payload.repository_owner);
            console.log('repository_owner_id:', payload.repository_owner_id);
            console.log('ref:', payload.ref);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::511974511969:role/jigmnnaga-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy JigmnNaga backend" \
            --parameters 'commands=[
              "set -e",
              "aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 511974511969.dkr.ecr.ap-northeast-2.amazonaws.com",
              "docker pull 511974511969.dkr.ecr.ap-northeast-2.amazonaws.com/jigmnnaga-backend:latest",
              "docker rm -f jigmnnaga-backend || true",
              "docker run -d --name jigmnnaga-backend --restart unless-stopped -p 8080:8080 --env-file /home/ec2-user/jigmnnaga.env 511974511969.dkr.ecr.ap-northeast-2.amazonaws.com/jigmnnaga-backend:latest"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "$EC2_INSTANCE_ID"