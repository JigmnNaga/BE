name: Backend CD

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: jigmnnaga-backend
  EC2_INSTANCE_ID: i-0e9ccacce90b1822e

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::511974511969:role/jigmnnaga-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE" .
          docker tag "$IMAGE" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          docker push "$IMAGE"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy to EC2
        id: deploy
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          export IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          cat > deploy.sh <<'SCRIPT'
          set -e
          set -o pipefail

          AWS_REGION="$1"
          IMAGE="$2"
          REGISTRY="${IMAGE%%/*}"

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"

          docker pull "$IMAGE"

          echo "Checking available disk space..."
          AVAILABLE_KB=$(df -Pk / | awk 'NR==2 {print $4}')

          if [ "$AVAILABLE_KB" -lt 524288 ]; then
            echo "Insufficient disk space: less than 512MiB available"
            exit 1
          fi

          echo "Preparing Docker network..."
          docker network inspect jigmnnaga-network >/dev/null 2>&1 ||
            docker network create jigmnnaga-network

          echo "Preparing Redis volume..."
          docker volume inspect jigmnnaga-redis-data >/dev/null 2>&1 ||
            docker volume create jigmnnaga-redis-data

          echo "Preparing Redis container..."
          if ! docker container inspect jigmnnaga-redis >/dev/null 2>&1; then
            docker run -d \
              --name jigmnnaga-redis \
              --restart unless-stopped \
              --network jigmnnaga-network \
              --network-alias redis \
              --memory 128m \
              --memory-swap 256m \
              --mount source=jigmnnaga-redis-data,target=/data \
              --health-cmd "redis-cli ping" \
              --health-interval 10s \
              --health-timeout 3s \
              --health-retries 5 \
              redis:7.4-alpine \
              redis-server \
                --appendonly yes \
                --maxmemory 64mb \
                --maxmemory-policy allkeys-lru
          else
            docker update \
              --memory 128m \
              --memory-swap 256m \
              jigmnnaga-redis

            docker start jigmnnaga-redis >/dev/null || true

            docker network connect \
              --alias redis \
              jigmnnaga-network jigmnnaga-redis 2>/dev/null || true
          fi

          echo "Waiting for Redis health check..."
          REDIS_READY=false

          for i in $(seq 1 30); do
            REDIS_STATUS=$(docker inspect \
              --format '{{.State.Health.Status}}' \
              jigmnnaga-redis 2>/dev/null) || true

            if [ "$REDIS_STATUS" = "healthy" ]; then
              REDIS_READY=true
              break
            fi

            sleep 2
          done

          if [ "$REDIS_READY" != "true" ]; then
            echo "Redis health check failed"
            docker logs --tail 100 jigmnnaga-redis || true
            exit 1
          fi

          echo "Redis is healthy"

          echo "Deploying backend..."
          docker rm -f jigmnnaga-backend || true

          docker run -d \
            --name jigmnnaga-backend \
            --restart unless-stopped \
            --network jigmnnaga-network \
            -p 8080:8080 \
            --env-file /home/ec2-user/jigmnnaga.env \
            -e REDIS_HOST=redis \
            -e REDIS_PORT=6379 \
            "$IMAGE"

          echo "Waiting for Spring Boot health check..."

          for i in $(seq 1 30); do
            RESPONSE=$(curl -fsS \
              --connect-timeout 2 \
              --max-time 3 \
              http://localhost:8080/actuator/health 2>/dev/null) || true

            if echo "$RESPONSE" | grep -q '"status":"UP"'; then
              echo "Health check passed"
              exit 0
            fi

            sleep 2
          done

          echo "Health check failed"
          docker logs --tail 100 jigmnnaga-backend || true
          exit 1
          SCRIPT

          python3 - <<'PY'
          import json
          import os
          import shlex

          with open("deploy.sh", encoding="utf-8") as f:
              script = f.read()

          region = shlex.quote(os.environ["AWS_REGION"])
          image = shlex.quote(os.environ["IMAGE"])

          command = (
              f"bash -s -- {region} {image} <<'DEPLOY_SCRIPT'\n"
              f"{script}\n"
              "DEPLOY_SCRIPT"
          )

          with open("ssm-params.json", "w", encoding="utf-8") as f:
              json.dump({"commands": [command]}, f)
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy JigmnNaga backend" \
            --parameters file://ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -e

          echo "Waiting for SSM deployment..."

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"; then
            echo "SSM waiter did not report success."
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)

          RESPONSE_CODE=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "ResponseCode" \
            --output text)

          if [ "$STATUS" != "Success" ] || [ "$RESPONSE_CODE" != "0" ]; then
            echo "Deployment failed: status=$STATUS, code=$RESPONSE_CODE"
            exit 1
          fi

          echo "Deployment successful"