
plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jigmnnaga'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// 로컬 개발 환경에서 .env 자동 로딩
def localEnv = [:]
def envFile = file('.env')

if (envFile.exists()) {
	envFile.eachLine('UTF-8') { line ->
		line = line.trim()

		if (!line || line.startsWith('#')) {
			return
		}

		def parts = line.split('=', 2)

		if (parts.length == 2) {
			def key = parts[0].trim()
			def value = parts[1].trim()

			if ((value.startsWith('"') && value.endsWith('"')) ||
					(value.startsWith("'") && value.endsWith("'"))) {
				value = value.substring(1, value.length() - 1)
			}

			localEnv[key] = value
		}
	}
}

// 시스템 환경변수 우선, 없으면 .env 사용
def resolveEnv = { key ->
	System.getenv(key) ?: localEnv[key]
}

// 일반 실행: 개발 DB 사용
tasks.withType(JavaExec).configureEach {
	localEnv.each { key, value ->
		if (System.getenv(key) == null) {
			environment key, value
		}
	}
}

// 테스트 실행: 테스트 DB 사용
tasks.withType(Test).configureEach {

	// DB 이외의 환경변수 전달
	localEnv.each { key, value ->
		if (!(key in [
				'DB_URL', 'DB_USERNAME', 'DB_PASSWORD',
				'TEST_DB_URL', 'TEST_DB_USERNAME', 'TEST_DB_PASSWORD'
		]) && System.getenv(key) == null) {
			environment key, value
		}
	}

	def testDbKeys = [
			DB_URL: 'TEST_DB_URL',
			DB_USERNAME: 'TEST_DB_USERNAME',
			DB_PASSWORD: 'TEST_DB_PASSWORD'
	]

	if (envFile.exists()) {
		// 로컬 환경: 테스트 DB 설정 필수
		testDbKeys.each { target, source ->
			def value = resolveEnv(source)

			if (!value) {
				throw new IllegalStateException(
						"${source} 환경변수를 설정해야 합니다."
				)
			}

			environment target, value
		}
	} else {
		// CI 환경: 기존 DB 환경변수 사용
		['DB_URL', 'DB_USERNAME', 'DB_PASSWORD'].each { key ->
			if (!System.getenv(key)) {
				throw new IllegalStateException(
						"${key} 환경변수를 설정해야 합니다."
				)
			}
		}
	}
}

dependencies {
	// Spring Boot
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// API 문서화 (Swagger)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

	// JWT 인증
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// 데이터베이스 (MySQL)
	runtimeOnly 'com.mysql:mysql-connector-j'

	// DB 마이그레이션 (Flyway)
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-mysql'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 테스트
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// 테스트용 Lombok
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}