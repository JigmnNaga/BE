spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      repositories:
        enabled: false

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

invite:
  base-url: ${INVITE_BASE_URL:https://jigeumnaga.app/i/}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  admin-key: ${KAKAO_ADMIN_KEY:}

google:
  # 구글 로그인 ID 토큰의 대상(aud)으로 허용할 OAuth 웹 클라이언트 ID (쉼표로 여러 개)
  client-ids: ${GOOGLE_CLIENT_ID:}

firebase:
  credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

aws:
  s3:
    bucket: ${S3_BUCKET_NAME:}
    region: ${AWS_REGION:ap-northeast-2}